name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and publish release zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: dsn-hawk
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install production Composer deps
        working-directory: dsn-hawk
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          fi

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}"     >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Stamp Version header and DSN_HAWK_VERSION constant
        working-directory: dsn-hawk
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update plugin header "Version: x.y.z"
          sed -i -E "s/^( \* Version:[[:space:]]+).*/\1${VERSION}/" dsn-hawk.php
          # Update DSN_HAWK_VERSION constant
          sed -i -E "s/(define\(\s*'DSN_HAWK_VERSION'\s*,\s*')[^']+('\s*\);)/\1${VERSION}\2/" dsn-hawk.php

      - name: Build distribution zip (keep dsn-hawk/ top-level folder)
        run: |
          zip -rq dsn-hawk.zip dsn-hawk \
            -x 'dsn-hawk/.git/*' \
            -x 'dsn-hawk/.github/*' \
            -x 'dsn-hawk/.gitignore' \
            -x 'dsn-hawk/.gitattributes' \
            -x 'dsn-hawk/.distignore' \
            -x 'dsn-hawk/.editorconfig' \
            -x 'dsn-hawk/tests/*' \
            -x 'dsn-hawk/phpunit.xml*' \
            -x 'dsn-hawk/phpcs.xml*' \
            -x 'dsn-hawk/README.md' \
            -x 'dsn-hawk/composer.lock' \
            -x 'dsn-hawk/node_modules/*'

      - name: Verify zip top-level folder
        run: |
          unzip -l dsn-hawk.zip | head -n 20
          # Sanity check: first entry must be dsn-hawk/
          FIRST=$(unzip -Z1 dsn-hawk.zip | head -n 1)
          if [[ "$FIRST" != dsn-hawk/* && "$FIRST" != "dsn-hawk" ]]; then
            echo "Zip does not start with dsn-hawk/ — got: $FIRST" >&2
            exit 1
          fi

      - name: Publish release with zip asset
        uses: softprops/action-gh-release@v2
        with:
          files: dsn-hawk.zip
          generate_release_notes: true
          draft: false
          prerelease: false
